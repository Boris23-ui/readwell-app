kind = "mobile"
previewPath = "/"
title = "ReadWell"
version = "1.0.0"
id = "artifacts/readwell"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22751

[services.development]
run = "pnpm --filter @workspace/readwell run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/readwell", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/readwell", "run", "serve" ]

[services.env]
PORT = "22751"
BASE_PATH = "/"
